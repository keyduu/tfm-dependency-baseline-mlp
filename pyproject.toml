[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-dependency-baseline3"
version = "0.2.0"
description = "Baseline neuronal B3 MLP para incompatibilidades entre dependencias Python"
readme = "README.md"
authors = [{ name = "Augusto Javier González Rodríguez" }]
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib",
    "numpy",
    "packaging>=23",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "torch>=2.4,<2.5",
]

[project.scripts]
tfm-baseline3 = "tfm_baseline3.cli:main"

[project.urls]
Repository = "https://github.com/keyduu/tfm-dependency-baseline-mlp"
Dataset = "https://huggingface.co/datasets/keyduu/pypi-dependency-compatibility-mvd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
