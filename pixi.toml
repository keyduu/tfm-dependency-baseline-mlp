[workspace]
name = "tfm_dependency_baseline3"
description = "Baseline neuronal B3 (MLP) — TFM MIAR 2025-26"
channels = ["nvidia", "pytorch", "conda-forge"]
platforms = ["linux-64"]
version = "0.2.0"

[tasks]
install-dev = "python -m pip install --no-deps --no-build-isolation -e ."
check-env = "python scripts/check_env.py"
train = "python -m tfm_baseline3.cli"
benchmark = "python -m tfm_baseline3.benchmark"
benchmark-inference = "python -m tfm_baseline3.inference_benchmark"
compare-graphsage = "python -m tfm_baseline3.compare"
analyze-predictions = "python -m tfm_baseline3.statistical_analysis"
test = "pytest -q"
lint = "ruff check ."
format = "ruff format ."

[dependencies]
python = "3.11.*"
pip = "*"
numpy = "==1.26.4"
pandas = "==2.3.3"
pyarrow = "==12.0.1"
packaging = "==26.2"
scikit-learn = "==1.8.0"
scipy = "==1.17.1"
joblib = "*"
pytest = "*"
ruff = "*"
pytorch = { version = "2.4.*", channel = "pytorch", build = "*cuda12.1*" }
pytorch-cuda = { version = "12.1.*", channel = "pytorch" }
